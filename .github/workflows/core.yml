name: Core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: Core portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain and targets
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup component add --toolchain 1.85.0 rustfmt
          rustup component add --toolchain 1.85.0 clippy
          rustup target add --toolchain 1.85.0 thumbv6m-none-eabi
          rustup target add --toolchain 1.85.0 thumbv7em-none-eabihf
          rustup target add --toolchain 1.85.0 thumbv8m.main-none-eabihf
          rustup target add --toolchain 1.85.0 riscv32imac-unknown-none-elf
      - name: Run public Core gates
        run: python tools/run_ci.py

  byte-mcs51:
    name: Core byte-machine (SDCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned SDCC
        shell: bash
        run: |
          curl --location --fail --retry 3 \
            --output sdcc-4.5.0.tar.bz2 \
            https://downloads.sourceforge.net/project/sdcc/sdcc-linux-amd64/4.5.0/sdcc-4.5.0-amd64-unknown-linux2.5.tar.bz2
          echo "3395722e3f8a31ce6a14c75fc419f586a3573b939f85efee5c88cdd35820a240  sdcc-4.5.0.tar.bz2" | sha256sum --check --strict
          tar --extract --bzip2 --file sdcc-4.5.0.tar.bz2
          echo "$PWD/sdcc-4.5.0/bin" >> "$GITHUB_PATH"
      - name: Verify byte-machine behavior and budgets
        run: python tools/check_byte_core.py --require-sdcc

  arduino:
    name: Arduino package (AVR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: arduino/arduino-lint-action@4de5fc895deecbda2f6b1cc05de7a8fdd5c4c51f
        with:
          version: "1.3.0"
          compliance: strict
          library-manager: submit
          project-type: library
          recursive: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02
      - name: Install pinned Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
      - name: Compile the public example
        run: >-
          arduino-cli compile
          --fqbn arduino:avr:nano:cpu=atmega328old
          --library .
          examples/BlinkCore

  platformio:
    name: PlatformIO package (AVR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned PlatformIO Core
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Compile the public example
        run: >-
          python -m platformio ci
          examples/BlinkCore/BlinkCore.ino
          --lib .
          --board uno
      - name: Assemble the registry package
        run: python -m platformio pkg pack . --output NobroRTOS-Core-1.0.0.tar.gz
