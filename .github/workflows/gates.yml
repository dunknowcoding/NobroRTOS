# Hosted mirror of the portable source and package checks.
name: gates
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same ref so only the newest commit's evidence stands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - name: user release boundary
        run: |
          python tools/checks/release/check_release_boundary.py
          python tools/checks/release/check_ci_hermeticity.py --selftest
      - name: python binding tests
        working-directory: bindings/python
        run: python -m unittest discover -s tests
      - name: software surface contract
        run: python sdk/cli/nobro.py contract check-software-surface
      - name: public documentation
        run: |
          python tools/checks/release/check_public_docs.py
          python tools/checks/core/check_report_trust_boundary.py
      - name: board profiles
        run: |
          python tools/checks/platforms/check_board_profiles.py
          python tools/checks/platforms/check_kernel_lite_candidates.py
      - name: scalable core layout
        run: python tools/checks/core/check_core_layout.py
      - name: adapter catalog
        run: |
          python tools/checks/integrations/check_adapter_catalog.py
          python sdk/cli/nobro.py adapter --selftest
          python tools/checks/platforms/check_board_features.py --selftest
      - name: one-file firmware project
        run: python sdk/cli/nobro.py firmware --selftest
      - name: sdk manifest
        run: |
          python tools/build/gen_api_contract.py --check
          python tools/checks/core/check_claim_contract.py
          python tools/checks/release/check_sdk_manifest.py
      - name: arduino package drift
        run: |
          python tools/release/package_arduino.py --check
          python tools/release/package_platformio.py --check
          python tools/checks/release/check_distribution_artifacts.py
          python tools/checks/integrations/check_arduino_facade.py
          python tools/checks/integrations/check_audio_facade.py
      - name: web flasher + block editor + tutorials
        run: |
          python tools/checks/product/check_web_flasher.py
          python tools/checks/product/check_block_editor.py
          python sdk/cli/nobro.py tutorials
      - name: codegen + public contract selftests
        run: |
          python sdk/cli/nobro.py ros-msg --selftest
          python sdk/cli/nobro.py import-dts --selftest
          python tools/checks/release/check_release_versions.py --release
          python tools/checks/integrations/check_ros_bridge.py --selftest
          python tools/checks/product/check_udi.py --selftest
          python sdk/cli/nobro.py shrink --selftest
          python tools/checks/platforms/check_hal_contract.py --selftest
          python tools/checks/platforms/check_platform_tiers.py --selftest
      - name: complete product experience gates
        run: |
          python sdk/cli/nobro.py app tutorials/hello-device/app.json
          python tools/checks/product/check_app_authoring.py
          python tools/release/package_prebuilt_uf2.py --check
          python sdk/cli/nobro.py admit --selftest
          python sdk/cli/nobro.py project --selftest
      - name: optimized-mode selftests (assert cannot be the only gate logic)
        # -O strips `assert`; these gates must still fail closed on their own logic.
        run: |
          python -O sdk/cli/nobro.py admit --selftest
          python -O tools/checks/platforms/check_hal_contract.py --selftest
          python -O tools/checks/platforms/check_platform_tiers.py --selftest
          python -O sdk/cli/nobro.py adapter --selftest
          python -O tools/checks/platforms/check_board_features.py --selftest
          python -O tools/checks/platforms/check_kernel_lite_candidates.py
          python -O sdk/cli/nobro.py firmware --selftest
          python -O sdk/cli/nobro.py shrink --selftest
          python -O tools/checks/product/check_udi.py --selftest
          python -O tools/checks/integrations/check_ros_bridge.py --selftest
          python -O sdk/cli/nobro.py ros-msg --selftest
          python -O sdk/cli/nobro.py import-dts --selftest
          python -O tools/build/gen_api_contract.py --check
          python -O tools/checks/core/check_claim_contract.py
  rust-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install exact stable Rust toolchain
        timeout-minutes: 10
        run: |
          rustup toolchain install 1.97.0 --profile minimal \
            --target thumbv7em-none-eabihf \
            --component clippy,rustfmt,llvm-tools-preview,rust-src
          rustup default 1.97.0
          rustc -vV | grep -F "commit-hash: 2d8144b7880597b6e6d3dfd63a9a9efae3f533d3"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - name: build generated firmware and prebuilt UF2 experiences
        run: |
          python sdk/cli/nobro.py firmware tutorials/rover-one-file/app.nobro --out _work/ci-firmware --build
          python tutorials/rover-python/app.py _work/python-authoring/app.json
          python sdk/cli/nobro.py firmware _work/python-authoring/app.json --out _work/python-firmware --build
          python tools/release/package_prebuilt_uf2.py --build
      - name: comprehensive Rust gates
        timeout-minutes: 35
        run: |
          python tools/checks/platforms/check_platform_tiers.py --begin-receipts rust-matrix
          python tools/checks/run_checks.py --rust-only
          python tools/checks/platforms/check_platform_tiers.py --run-gate nrf52840-hal-host
          python tools/checks/platforms/check_platform_tiers.py --run-gate nrf52840-usb-host
          python tools/checks/platforms/check_platform_tiers.py --run-gate provider-lifecycle-host
          python tools/checks/platforms/check_platform_tiers.py --run-gate esp8266-lifecycle-host
          python tools/checks/platforms/check_platform_tiers.py --assert-receipts rust-matrix

  supply-chain-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install exact stable Rust toolchain
        timeout-minutes: 10
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rust-src
          rustup default 1.97.0
          rustc -vV | grep -F "commit-hash: 2d8144b7880597b6e6d3dfd63a9a9efae3f533d3"
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cargo-audit@0.22.2,cargo-llvm-cov@0.8.7
          fallback: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - name: locked source and license policy
        run: python tools/checks/core/check_dependency_policy.py
      - name: advisory database audit
        working-directory: core
        # cargo-audit reads a lockfile directly and has no --locked option.
        timeout-minutes: 10
        run: |
          git clone https://github.com/RustSec/advisory-db.git ../_work/advisory-db
          git -C ../_work/advisory-db checkout --detach 29638ff054fdbb83d2844240f7ef7e576cb52629
          test "$(git -C ../_work/advisory-db rev-parse HEAD)" = \
            "29638ff054fdbb83d2844240f7ef7e576cb52629"
          cargo audit --db ../_work/advisory-db --file Cargo.lock
      - name: portable coverage
        working-directory: core
        timeout-minutes: 25
        run: >-
          cargo llvm-cov --locked -p nobro-kernel -p nobro-net -p nobro-secure
          -p nobro-admission -p nobro-storage -p nobro-database -p nobro-power -p nobro-sal
          -p nobro-audio -p nobro-servo
          --target x86_64-unknown-linux-gnu --fail-under-lines 90
          --lcov --output-path ../coverage.lcov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: coverage.lcov

  miri-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install exact Miri nightly
        timeout-minutes: 10
        run: |
          rustup toolchain install nightly-2026-07-03 --profile minimal \
            --component miri,rust-src
          rustup default nightly-2026-07-03
          rustc -vV | grep -F "commit-hash: c397dae808f70caebab1fc4e11b3edf7e59f58c7"
      - name: Miri portable safety boundary
        working-directory: core
        timeout-minutes: 50
        run: >-
          cargo miri test --locked --target x86_64-unknown-linux-gnu
          -p nobro-database -p nobro-storage -p nobro-net -p nobro-secure -p nobro-hal
          -p nobro-audio -p nobro-servo
      - name: Miri bounded async and executor-cell boundary
        working-directory: core
        timeout-minutes: 50
        env:
          # AsyncCore is embedded with static-cell lifetime; tests model that with Box::leak.
          MIRIFLAGS: -Zmiri-ignore-leaks
        # `cargo test` takes a single positional filter, so each bounded async
        # or one-shot initialization surface is checked separately.
        run: |
          cargo miri test --locked --target x86_64-unknown-linux-gnu -p nobro-kernel async_rt::tests
          cargo miri test --locked --target x86_64-unknown-linux-gnu -p nobro-kernel async_mpmc::tests
          cargo miri test --locked --target x86_64-unknown-linux-gnu -p nobro-kernel health::tests::in_place_initialization_matches_const_constructor
          cargo miri test --locked --target x86_64-unknown-linux-gnu -p nobro-kernel graph::tests::reactor_domain_linkage
          cargo miri test --locked --target x86_64-unknown-linux-gnu -p nobro-kernel graph::tests::graph_spec_starts_and_seals_executor_without_retained_built_graph
          cargo miri test --locked --target x86_64-unknown-linux-gnu -p nobro-kernel graph::tests::graph_validation_failure_does_not_claim_the_executor_cell
          cargo miri test --locked --target x86_64-unknown-linux-gnu -p nobro-kernel graph::tests::graph_executor_init_failure_restores_the_cell_for_retry
          cargo miri test --locked --target x86_64-unknown-linux-gnu -p nobro-kernel kernel_executor::tests::executor_graph_workspace_keeps_scratch_disjoint_from_admission
          cargo miri test --locked --target x86_64-unknown-linux-gnu -p nobro-hal --no-default-features --features platform-nrf52840,board-promicro-nosd,nrf-twim-async twim_hw::async_provider::tests
          cargo miri test --locked --target x86_64-unknown-linux-gnu --manifest-path ports/ra4m1/Cargo.toml --lib event_dma::tests
      - name: address sanitizer smoke
        working-directory: core
        timeout-minutes: 20
        env:
          CARGO_TARGET_DIR: ../_work/ci-asan
          RUSTFLAGS: -Zsanitizer=address
        run: >-
          cargo test --locked --target x86_64-unknown-linux-gnu
          -p nobro-database -p nobro-storage -p nobro-net -p nobro-secure

  cross-mcu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install exact stable Rust toolchain
        timeout-minutes: 10
        run: |
          rustup toolchain install 1.97.0 --profile minimal \
            --target thumbv6m-none-eabi,thumbv7m-none-eabi,thumbv7em-none-eabihf,thumbv8m.main-none-eabihf,riscv32imc-unknown-none-elf,riscv32imac-unknown-none-elf,riscv32imafc-unknown-none-elf \
            --component clippy,rust-src,llvm-tools-preview
          rustup default 1.97.0
          rustc -vV | grep -F "commit-hash: 2d8144b7880597b6e6d3dfd63a9a9efae3f533d3"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - name: install classic ESP32 and ESP32-S3 Xtensa Rust toolchain
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          espup_zip=/tmp/espup-x86_64-unknown-linux-gnu.zip
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 10 \
            --output "$espup_zip" \
            https://github.com/esp-rs/espup/releases/download/v0.17.1/espup-x86_64-unknown-linux-gnu.zip
          echo "dd8625b3742b2f74ce406286baef8ee67525d63b25ea303ddf7473ed2cc31192  $espup_zip" \
            | sha256sum --check --strict
          unzip -o "$espup_zip" -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/espup"
          "$HOME/.cargo/bin/espup" install -l debug --targets esp32,esp32s3 \
            --toolchain-version 1.95.0.0
          source "$HOME/export-esp.sh"
          echo "$PATH" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
      - name: install Tier-C Arm linker
        timeout-minutes: 10
        run: |
          set -euo pipefail
          archive=/tmp/xpack-arm-none-eabi-gcc-13.3.1-1.1-linux-x64.tar.gz
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 10 \
            --output "$archive" \
            https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.3.1-1.1/xpack-arm-none-eabi-gcc-13.3.1-1.1-linux-x64.tar.gz
          echo "006c89337eced277fdf4c1c3bf3aebe55c85e8d52cba8d412009717fb781b959  $archive" \
            | sha256sum --check --strict
          mkdir -p "$HOME/.local/xpack"
          tar -xzf "$archive" -C "$HOME/.local/xpack"
          echo "$HOME/.local/xpack/xpack-arm-none-eabi-gcc-13.3.1-1.1/bin" \
            >> "$GITHUB_PATH"
      - name: full reproducible cross-MCU matrix
        timeout-minutes: 50
        run: bash tools/checks/ci_matrix.sh

  arduino-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned Arduino CLI
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          archive=/tmp/arduino-cli_1.5.1_Linux_64bit.tar.gz
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 10 \
            --output "$archive" \
            https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz
          echo "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b  $archive" \
            | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" arduino-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version | grep -F "Version: 1.5.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - name: install representative cores
        timeout-minutes: 25
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli core install arduino:samd@1.8.14
          arduino-cli core install arduino:renesas_uno@1.6.0
          arduino-cli core install esp32:esp32@3.3.10 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp8266:esp8266@3.1.2 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli lib install ArduinoBLE@2.1.0
      - name: prepare pinned audio member
        run: |
          git clone https://github.com/dunknowcoding/NiusAudio.git _work/NiusAudio
          git -C _work/NiusAudio checkout --detach c81851ef0771f1de4b721ea0d1cd6e9daa34838a
          test "$(git -C _work/NiusAudio rev-parse HEAD)" = \
            "c81851ef0771f1de4b721ea0d1cd6e9daa34838a"
      - name: prepare and compile pinned display member
        run: |
          git clone https://github.com/dunknowcoding/NiusDisplay.git _work/NiusDisplay
          git -C _work/NiusDisplay checkout --detach a9d005719d81456038fbad9d4b01a75272a8b77a
          test "$(git -C _work/NiusDisplay rev-parse HEAD)" = \
            "a9d005719d81456038fbad9d4b01a75272a8b77a"
          arduino-cli compile --library packages/arduino --library _work/NiusDisplay \
            -b arduino:avr:uno packages/arduino/examples/NiusDisplayBounded
      - name: compile public package examples (AVR, UNO R4, ESP32-S3, ESP8266)
        timeout-minutes: 35
        env:
          NOBRO_ARDUINO_FQBNS: arduino:avr:uno,arduino:renesas_uno:unor4wifi,esp32:esp32:esp32s3,esp8266:esp8266:d1_mini
        run: |
          python tools/checks/platforms/check_platform_tiers.py --begin-receipts arduino-package
          python tools/checks/platforms/check_platform_tiers.py --run-gate arduino-facade-contract
          python tools/checks/platforms/check_platform_tiers.py --run-gate arduino-ra4m1-compile
          python tools/checks/platforms/check_platform_tiers.py --run-gate arduino-wifis3-target-build
          python tools/checks/platforms/check_platform_tiers.py --run-gate arduino-ble-unor4-target-build
          python tools/checks/platforms/check_platform_tiers.py --run-gate arduino-esp-wifi-target-build
          python tools/checks/platforms/check_platform_tiers.py --run-gate arduino-esp-ble-target-build
          python tools/checks/platforms/check_platform_tiers.py --run-gate esp8266-arduino-target-build
          python tools/checks/platforms/check_platform_tiers.py --run-gate avr-nano-arduino-target-build
          python tools/checks/platforms/check_platform_tiers.py --run-gate esp32-arduino-peripheral-target-build
          python tools/checks/platforms/check_platform_tiers.py --run-gate esp32s3-arduino-audio-target-build
      - name: pinned NiusIMU integration
        run: |
          git clone https://github.com/dunknowcoding/ArduinoNRF-IMU.git _work/ArduinoNRF-IMU
          git -C _work/ArduinoNRF-IMU checkout --detach 0fb18445c99bf4a28693f409187942d72325adb5
          test "$(git -C _work/ArduinoNRF-IMU rev-parse HEAD)" = \
            "0fb18445c99bf4a28693f409187942d72325adb5"
          python tools/checks/integrations/check_niusimu_adapter.py --library _work/ArduinoNRF-IMU --inventory-only
          python tools/checks/integrations/check_niusimu_adapter.py --selftest
      - name: pinned sensor member integrations
        run: |
          git clone https://github.com/dunknowcoding/INA_series_sensor.git _work/INA_series_sensor
          git -C _work/INA_series_sensor checkout --detach c806fb8d1ad75c85f86413aee5a1306eff191918
          test "$(git -C _work/INA_series_sensor rev-parse HEAD)" = \
            "c806fb8d1ad75c85f86413aee5a1306eff191918"
          git clone https://github.com/dunknowcoding/DiFinders.git _work/DiFinders
          git -C _work/DiFinders checkout --detach 1ccffa5cf8f34c7ab933f85c7956021a4692256e
          test "$(git -C _work/DiFinders rev-parse HEAD)" = \
            "1ccffa5cf8f34c7ab933f85c7956021a4692256e"
          python tools/checks/integrations/check_sensor_member_integrations.py \
            --ina _work/INA_series_sensor --difinders _work/DiFinders \
            --fqbn arduino:avr:uno --fqbn arduino:samd:mkrzero \
            --fqbn arduino:renesas_uno:unor4wifi --fqbn esp32:esp32:esp32c3
      - name: pinned wireless integrations
        run: |
          git clone https://github.com/dunknowcoding/NiusWireless.git _work/NiusWireless
          git -C _work/NiusWireless checkout --detach 97e2883a0df4ba50c1b0e248e9c72869cc44240b
          test "$(git -C _work/NiusWireless rev-parse HEAD)" = \
            "97e2883a0df4ba50c1b0e248e9c72869cc44240b"
          git clone https://github.com/dunknowcoding/ArduinoNRF-Zigbee.git _work/ArduinoNRF-Zigbee
          git -C _work/ArduinoNRF-Zigbee checkout --detach 39a3203d0528323dba80585abfa2304edc4d6e70
          test "$(git -C _work/ArduinoNRF-Zigbee rev-parse HEAD)" = \
            "39a3203d0528323dba80585abfa2304edc4d6e70"
          python tools/checks/integrations/check_wireless_integrations.py \
            --niuswireless _work/NiusWireless \
            --niuszigbee _work/ArduinoNRF-Zigbee --compile
          python tools/checks/platforms/check_platform_tiers.py \
            --run-gate arduino-samd21-pn532-target-build
      - name: pinned camera integration
        run: |
          git clone https://github.com/dunknowcoding/NiusCam.git _work/NiusCam
          git -C _work/NiusCam checkout --detach b03560adf4da07e4a16b4d9e658a01d74ccb9340
          test "$(git -C _work/NiusCam rev-parse HEAD)" = \
            "b03560adf4da07e4a16b4d9e658a01d74ccb9340"
          python tools/checks/platforms/check_platform_tiers.py \
            --run-gate camera-arduino-target-build
      - name: bounded ESP32 peripheral integrations
        run: |
          python tools/checks/integrations/check_esp32_peripheral_facade.py
          python tools/checks/platforms/check_platform_tiers.py --assert-receipts arduino-package

  arduino-nrf-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned Arduino CLI
        shell: pwsh
        timeout-minutes: 10
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "arduino-cli_1.5.1_Windows_64bit.zip"
          $toolDir = Join-Path $env:RUNNER_TEMP "arduino-cli-1.5.1"
          curl.exe --fail --location --retry 6 --retry-all-errors --retry-delay 10 `
            --output $archive `
            https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Windows_64bit.zip
          if ($LASTEXITCODE -ne 0) { throw "Arduino CLI download failed" }
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = "fabe42e0eb04d00e776a66178299ff95a46c623dbc260f997e58fd514853dd40"
          if ($actualHash -ne $expectedHash) { throw "Arduino CLI archive digest mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir -Force
          $binary = Join-Path $toolDir "arduino-cli.exe"
          $version = & $binary version
          if ($version -notmatch "Version: 1\.5\.1") { throw "unexpected Arduino CLI: $version" }
          $toolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - name: pristine Windows archive/install/use
        shell: pwsh
        # This image no longer guarantees host GCC. The later ArduinoNRF step
        # compiles the package with its pinned native toolchain.
        run: |
          python tools/build/gen_api_contract.py --check
          python tools/checks/core/check_claim_contract.py
          python tools/checks/release/check_distribution_artifacts.py --skip-header-compile
      - name: install pinned ArduinoNRF core
        shell: pwsh
        timeout-minutes: 25
        run: |
          $index = "https://raw.githubusercontent.com/dunknowcoding/ArduinoNRF/0add1ce4842b346316334d41f1038e792f3b6958/package_arduinonrf_index.json"
          arduino-cli core update-index --additional-urls $index
          arduino-cli core install arduinonrf:nrf52@0.3.11 --additional-urls $index
      - name: compile public package examples (ArduinoNRF)
        shell: pwsh
        timeout-minutes: 35
        run: |
          python tools/checks/platforms/check_platform_tiers.py --begin-receipts arduino-nrf-package
          python tools/checks/platforms/check_platform_tiers.py --run-gate arduino-nrf52840-compile
          python tools/checks/platforms/check_platform_tiers.py --assert-receipts arduino-nrf-package
      - name: compile pinned NiusIMU integration (ArduinoNRF)
        shell: pwsh
        run: |
          git clone https://github.com/dunknowcoding/ArduinoNRF-IMU.git _work/ArduinoNRF-IMU
          git -C _work/ArduinoNRF-IMU checkout --detach 0fb18445c99bf4a28693f409187942d72325adb5
          if ((git -C _work/ArduinoNRF-IMU rev-parse HEAD) -ne "0fb18445c99bf4a28693f409187942d72325adb5") {
            throw "NiusIMU checkout drift"
          }
          python tools/checks/integrations/check_niusimu_adapter.py --library _work/ArduinoNRF-IMU --fqbn "arduinonrf:nrf52:promicro_nrf52840:usbcdc=enabled"
      - name: compile pinned sensor member integrations (ArduinoNRF)
        shell: pwsh
        run: |
          git clone https://github.com/dunknowcoding/INA_series_sensor.git _work/INA_series_sensor
          git -C _work/INA_series_sensor checkout --detach c806fb8d1ad75c85f86413aee5a1306eff191918
          if ((git -C _work/INA_series_sensor rev-parse HEAD) -ne "c806fb8d1ad75c85f86413aee5a1306eff191918") {
            throw "INA Series Sensor checkout drift"
          }
          git clone https://github.com/dunknowcoding/DiFinders.git _work/DiFinders
          git -C _work/DiFinders checkout --detach 1ccffa5cf8f34c7ab933f85c7956021a4692256e
          if ((git -C _work/DiFinders rev-parse HEAD) -ne "1ccffa5cf8f34c7ab933f85c7956021a4692256e") {
            throw "DiFinders checkout drift"
          }
          python tools/checks/integrations/check_sensor_member_integrations.py `
            --ina _work/INA_series_sensor --difinders _work/DiFinders `
            --fqbn "arduinonrf:nrf52:promicro_nrf52840:usbcdc=enabled"
      - name: compile pinned NiusZigbee integration (ArduinoNRF)
        shell: pwsh
        run: |
          git clone https://github.com/dunknowcoding/NiusWireless.git _work/NiusWireless
          git -C _work/NiusWireless checkout --detach 97e2883a0df4ba50c1b0e248e9c72869cc44240b
          if ((git -C _work/NiusWireless rev-parse HEAD) -ne "97e2883a0df4ba50c1b0e248e9c72869cc44240b") {
            throw "NiusWireless checkout drift"
          }
          git clone https://github.com/dunknowcoding/ArduinoNRF-Zigbee.git _work/ArduinoNRF-Zigbee
          git -C _work/ArduinoNRF-Zigbee checkout --detach 39a3203d0528323dba80585abfa2304edc4d6e70
          if ((git -C _work/ArduinoNRF-Zigbee rev-parse HEAD) -ne "39a3203d0528323dba80585abfa2304edc4d6e70") {
            throw "NiusZigbee checkout drift"
          }
          python tools/checks/integrations/check_wireless_integrations.py --niuswireless _work/NiusWireless --niuszigbee _work/ArduinoNRF-Zigbee --compile-nrf --compile-zigbee
