[package]
name = "isolation-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "isolation_demo"
path = "src/main.rs"

[[bin]]
name = "slice_timing_demo"
path = "src/slice_timing.rs"
required-features = ["slice-timing"]

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
nobro-hal = { path = "../../../crates/nobro_hal", default-features = false, features = [
    "platform-nrf52840-rt",
    "cortex-m-slice",
    "pmsa-v7",
] }
nobro-kernel = { path = "../../../crates/nobro_kernel", features = ["preemptive"] }
nobro-power = { path = "../../../crates/nobro_power" }
nrf52840-pac = { version = "0.12", features = ["rt"] }
panic-halt = "0.2"

[features]
default = ["board-promicro-nosd"]
board-promicro-nosd = ["nobro-hal/board-promicro-nosd"]
board-promicro-s140 = ["nobro-hal/board-promicro-s140"]
slice-timing = []
