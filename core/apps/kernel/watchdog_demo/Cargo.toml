[package]
name = "watchdog-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Watchdog recovery on real hardware: arm the nRF WDT, let it reset the chip, then
# detect the watchdog reset cause on reboot and report status recovery.
[[bin]]
name = "watchdog_demo"
path = "src/main.rs"
required-features = ["board-promicro-nosd"]

[[bin]]
name = "watchdog_demo_s140"
path = "src/main.rs"
required-features = ["board-promicro-s140"]

[dependencies]
nobro-hal = { path = "../../../crates/nobro_hal", default-features = false }
nobro-kernel = { path = "../../../crates/nobro_kernel" }
critical-section = "1.2"
cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
nrf52840-pac = { version = "0.12", features = ["rt"] }
panic-halt = "0.2"

[features]
default = ["board-promicro-nosd"]
board-promicro-nosd = ["nobro-hal/board-promicro-nosd"]
board-promicro-s140 = ["nobro-hal/board-promicro-s140"]
