[package]
name = "nobro-port-rp2040"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "nobro-port-rp2040"
path = "src/main.rs"

[[bin]]
name = "nobro-rp2040-slice-selftest"
path = "src/slice_selftest.rs"
required-features = ["slice-selftest"]

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"
pio = "0.3"
rp2040-boot2 = "0.3"
rp2040-hal = { version = "0.12", features = ["critical-section-impl", "rt"] }
usb-device = "0.3"
usbd-serial = "0.2"
nobro-hal = { path = "../../crates/nobro_hal", default-features = false, features = ["contract-only"] }
nobro-kernel = { path = "../../crates/nobro_kernel" }

[features]
default = []
# Opt-in DMA_IRQ_0 completion provider. W115 adds its physical copy,
# cancellation, timeout, and wake-latency evidence.
dma-completion = []
# Cortex-M0+ TIMER alarm plus PendSV forced-suspension proof. The regular
# RP2040 firmware does not retain the extra stacks or switch mechanism.
slice-selftest = ["nobro-hal/cortex-m0-slice"]

[profile.release]
debug = 2
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"

[workspace]
