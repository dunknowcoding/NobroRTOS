[package]
name = "nobro-port-rp2350"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

# NobroRTOS portable-core bring-up on the RP2350 (Pico 2 W, Cortex-M33)  - with
# self-DFU autonomy (serial 'DFU' command reboots to BOOTSEL). Reports provider and
# multicore application status over USB-CDC. Standalone
# workspace: the rp235x-hal tree is independent of the thumbv7em core workspace.

[dependencies]
rp235x-hal = { version = "0.4", features = ["critical-section-impl", "rt"] }
usb-device = "0.3"
usbd-serial = "0.2"
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"
pio = "0.3"
nobro-hal = { path = "../../crates/nobro_hal", default-features = false, features = ["contract-only"] }
nobro-kernel = { path = "../../crates/nobro_kernel" }

[features]
default = ["cyw43-pio"]
# Opt-in DMA_IRQ_0 completion future and boot-time functional self-test.
dma-completion = []
cyw43-pio = []
cyw43-vendor = []

[profile.release]
debug = 2
lto = true
opt-level = "s"
codegen-units = 1

[workspace]
