[package]
name = "nobro-port-esp32p4"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

# ESP32-P4 support is pinned to the last physically validated upstream revision
# before early whole-cache invalidation moved ahead of runtime initialization.
# That later sequence causes LP-WDT reset loops on revision-v1.3 silicon.

[dependencies]
embedded-hal = "1.0"
nb = "1"
riscv = "0.16.1"
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "479c5ea7f9ea6ec3b77538fa547645c74163c501", features = ["esp32p4", "unstable"] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "479c5ea7f9ea6ec3b77538fa547645c74163c501", features = ["esp32p4"] }
esp-sync = { path = "../../vendor/esp-sync", features = ["esp32p4"] }
nobro-hal = { path = "../../crates/nobro_hal", default-features = false, features = ["contract-only"] }
nobro-kernel = { path = "../../crates/nobro_kernel", default-features = false }
nobro-usb = { path = "../../crates/nobro_usb", default-features = false, features = ["backend-usb-serial-jtag-esp32p4"] }

[features]
default = []
esp32p4-v3 = ["esp-sync/esp32p4-zcmp-workaround"]

[patch."https://github.com/esp-rs/esp-hal"]
esp-sync = { path = "../../vendor/esp-sync" }

[profile.release]
debug = 2
lto = true
opt-level = "s"
codegen-units = 1

[workspace]
